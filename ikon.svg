<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Bakgrund: djup skogsgrön (editorial) med varm glöd nedtill -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2620"/>
      <stop offset="0.55" stop-color="#121a15"/>
      <stop offset="1" stop-color="#0a0f0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.68" r="0.5">
      <stop offset="0" stop-color="#e0553d" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#e0553d" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e0553d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topglow" cx="0.5" cy="0.22" r="0.45">
      <stop offset="0" stop-color="#f2f0ea" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f2f0ea" stop-opacity="0"/>
    </radialGradient>
    <!-- Sand: vermilion med ljus kant -->
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08a6a"/>
      <stop offset="0.5" stop-color="#e0553d"/>
      <stop offset="1" stop-color="#b8412c"/>
    </linearGradient>
    <linearGradient id="sandTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4a086"/>
      <stop offset="1" stop-color="#d94d34"/>
    </linearGradient>
    <!-- Glas: kräm med gradient så konturen får djup -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2f0ea"/>
      <stop offset="1" stop-color="#cfd6cc"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f0ea" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#f2f0ea" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#f2f0ea" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="tiny" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="glassClip"><path d="M 352 268 L 672 268 C 672 410 560 464 544 512 C 560 560 672 614 672 756 L 352 756 C 352 614 464 560 480 512 C 464 464 352 410 352 268 Z"/></clipPath>
  </defs>

  <clipPath id="rund"><rect width="1024" height="1024" rx="224"/></clipPath><g clip-path="url(#rund)"><rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <rect width="1024" height="1024" fill="url(#topglow)"/>

  <g transform="translate(512 512) scale(1.2) translate(-512 -512)">
  <!-- mjuk skugga bakom glaset -->
  <path d="M 352 268 L 672 268 C 672 410 560 464 544 512 C 560 560 672 614 672 756 L 352 756 C 352 614 464 560 480 512 C 464 464 352 410 352 268 Z" fill="#000" fill-opacity="0.45" filter="url(#softer)" transform="translate(0 26)"/>

  <!-- glasets inre -->
  <path d="M 352 268 L 672 268 C 672 410 560 464 544 512 C 560 560 672 614 672 756 L 352 756 C 352 614 464 560 480 512 C 464 464 352 410 352 268 Z" fill="url(#inner)"/>

  <g clip-path="url(#glassClip)">
    <!-- glöd runt sandhögen -->
    <ellipse cx="512" cy="740" rx="150" ry="60" fill="#e0553d" fill-opacity="0.35" filter="url(#soft)"/>
    <!-- sandhög i nedre bulben, mjuk kulle -->
    <path d="M 340 760 L 690 760 L 690 736 C 640 708 570 688 528 652 C 520 646 506 646 498 652 C 456 688 386 708 340 736 Z" fill="url(#sand)"/>
    <!-- ljus kant på högen -->
    <path d="M 498 652 C 506 646 520 646 528 652 C 560 680 610 698 650 716" fill="none" stroke="#ffb59e" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7" filter="url(#tiny)"/>
    <!-- fallande stråle -->
    <rect x="504" y="470" width="16" height="200" rx="8" fill="url(#sand)"/>
    <rect x="507" y="470" width="4" height="200" rx="2" fill="#ffc4b0" fill-opacity="0.55"/>
    <!-- sandkorn i luften -->
    <circle cx="500" cy="600" r="4" fill="#f4a086"/><circle cx="526" cy="628" r="3.5" fill="#f4a086"/><circle cx="496" cy="648" r="3" fill="#f08a6a"/><circle cx="530" cy="586" r="2.8" fill="#f4a086"/>
    <!-- sand kvar i övre bulben, tunn med djup -->
    <ellipse cx="512" cy="472" rx="58" ry="17" fill="url(#sandTop)"/>
    <ellipse cx="512" cy="466" rx="58" ry="12" fill="#f4a086" fill-opacity="0.55"/>
    <!-- glasreflex (vänster sida) -->
    <path d="M 386 300 C 384 380 420 430 452 470" fill="none" stroke="url(#highlight)" stroke-width="22" stroke-linecap="round"/>
    <path d="M 386 560 C 380 620 372 680 374 740" fill="none" stroke="url(#highlight)" stroke-width="18" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>

  <!-- glasets kontur -->
  <path d="M 352 268 L 672 268 C 672 410 560 464 544 512 C 560 560 672 614 672 756 L 352 756 C 352 614 464 560 480 512 C 464 464 352 410 352 268 Z"
        fill="none" stroke="url(#glass)" stroke-width="30" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- topp- och bottenlock med rundade ändar -->
  <rect x="292" y="238" width="440" height="42" rx="21" fill="url(#glass)"/>
  <rect x="292" y="744" width="440" height="42" rx="21" fill="url(#glass)"/>
  <rect x="300" y="243" width="424" height="10" rx="5" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="300" y="749" width="424" height="10" rx="5" fill="#ffffff" fill-opacity="0.5"/>
  </g>
</g></svg>